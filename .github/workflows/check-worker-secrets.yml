name: Check Worker Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check admin password binding
        run: |
          npx wrangler secret list --format json > worker-secrets.json
          if grep -q 'ADMIN_PASSWORD' worker-secrets.json; then
            echo "ADMIN_PASSWORD is configured for the indexcms Worker."
          else
            echo "ADMIN_PASSWORD is missing from the indexcms Worker."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
