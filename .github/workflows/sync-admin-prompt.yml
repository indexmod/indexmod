name: Sync Admin Prompt

on:
  push:
    branches:
      - main
    paths:
      - prompt.md
      - src/templates/prompt.js
      - scripts/sync-admin-prompt.mjs
      - .github/workflows/sync-admin-prompt.yml
  workflow_dispatch:

concurrency:
  group: sync-admin-prompt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-admin-prompt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Upload admin prompt to R2
        run: node scripts/sync-admin-prompt.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: indexmod
