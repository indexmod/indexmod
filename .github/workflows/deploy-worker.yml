name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Rebuild cached homepage in R2
        run: |
          cursor=""
          for batch in $(seq 1 200); do
            response=$(curl --fail --silent --show-error --request POST \
              --get --data-urlencode "cursor=$cursor" \
              https://indexmod.press/_rebuild)
            done=$(jq -r '.done' <<<"$response")
            if [ "$done" = "true" ]; then
              exit 0
            fi
            cursor=$(jq -r '.cursor' <<<"$response")
          done

          exit 1
